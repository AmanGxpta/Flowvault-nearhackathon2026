# Test, build and deploy the FlowVault Worker on every push to main (or by hand from the Actions tab).
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   CLOUDFLARE_API_TOKEN      token from the "Edit Cloudflare Workers" template, plus Account > D1 > Edit
#   CLOUDFLARE_ACCOUNT_ID     Cloudflare account ID
#   FLOWVAULT_D1_DATABASE_ID  UUID of the D1 database the Worker uses
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   FLOWVAULT_WORKER_NAME     optional, defaults to flowvault-app
#   FLOWVAULT_DOMAIN          optional, e.g. app.flowvault.live; set it only once the zone is active on Cloudflare
#
# Worker secrets (NEARAI_API_KEY and the rest) live in Cloudflare and survive deploys; they are never set here.
# Until the three repository secrets exist, the workflow still runs the tests and skips the deploy step.

name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FLOWVAULT_D1_DATABASE_ID: ${{ secrets.FLOWVAULT_D1_DATABASE_ID }}
      FLOWVAULT_WORKER_NAME: ${{ vars.FLOWVAULT_WORKER_NAME }}
      FLOWVAULT_DOMAIN: ${{ vars.FLOWVAULT_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check deploy settings
        id: settings
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$FLOWVAULT_D1_DATABASE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and FLOWVAULT_D1_DATABASE_ID as repository secrets."
          fi

      - name: Build and deploy
        if: steps.settings.outputs.ready == 'true'
        run: npm run deploy
